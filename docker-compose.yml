services:
  # PostgreSQL + TimescaleDB.
  # TimescaleDB is a drop-in PostgreSQL extension, so the SQLAlchemy models,
  # Alembic migrations, and connection string are unchanged; the time-series
  # tables (indicator_observations, risk_scores, model_metrics) additionally
  # become compressed, time-partitioned hypertables with continuous aggregates.
  postgres:
    image: timescale/timescaledb:2.15.2-pg15
    container_name: beacon-postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - timescaledb.telemetry_level=off
      - -c
      - max_worker_processes=16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beacon_db}
      POSTGRES_USER: ${POSTGRES_USER:-beacon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beacon_password}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon_user -d beacon_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beacon-network
    restart: unless-stopped

  # Redis for Celery and caching
  redis:
    image: redis:7-alpine
    container_name: beacon-redis
    command: redis-server --appendonly yes --save 60 1 --loglevel warning
    sysctls:
      - net.core.somaxconn=511
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beacon-network
    restart: unless-stopped

  # Backend API (FastAPI)
  # Note: GPU support is configured via docker-compose.gpu.yml overlay
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.cpu  # Default to CPU for compatibility
    container_name: beacon-backend
    ports:
      - "3456:3456"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-beacon_user}:${POSTGRES_PASSWORD:-beacon_password}@postgres:5432/${POSTGRES_DB:-beacon_db}?client_encoding=utf8
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONPATH: /app
      PORT: 3456
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONIOENCODING: utf-8
      FRED_API_KEY: ${FRED_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      SEC_API_KEY: ${SEC_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      # No model weights are mounted: the Toto 2.0 encoder stack was removed in
      # the 2026-09 hygiene round (REMOVED register, backend/tests/test_reachability.py;
      # docs/deployment.md section 3). Nothing in the runtime reads /models or
      # BEACON_MODEL_DIR. A foundation encoder returns only in the same change
      # that wires an engine path to embed nodes with it -- and its read-only
      # host mount returns with it.
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
      - ./models:/app/saved_models
      - ./logs:/app/logs
      - ./results:/app/results
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beacon-network
    restart: unless-stopped
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 3456

  # Celery Worker for background tasks
  # Note: GPU support is configured via docker-compose.gpu.yml overlay
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.cpu  # Default to CPU for compatibility
    container_name: beacon-celery-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-beacon_user}:${POSTGRES_PASSWORD:-beacon_password}@postgres:5432/${POSTGRES_DB:-beacon_db}?client_encoding=utf8
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONPATH: /app
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONIOENCODING: utf-8
      FRED_API_KEY: ${FRED_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      SEC_API_KEY: ${SEC_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      # No model weights are mounted: the Toto 2.0 encoder stack was removed in
      # the 2026-09 hygiene round (REMOVED register, backend/tests/test_reachability.py;
      # docs/deployment.md section 3). Nothing in the runtime reads /models or
      # BEACON_MODEL_DIR. A foundation encoder returns only in the same change
      # that wires an engine path to embed nodes with it -- and its read-only
      # host mount returns with it.
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
      - ./models:/app/saved_models
      - ./logs:/app/logs
      - ./results:/app/results
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - beacon-network
    restart: unless-stopped
    command: celery -A backend.tasks.celery_app worker --loglevel=info --concurrency=2

  # Frontend (React 18 + Vite + Deck.gl 2D risk map)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Deliberately empty, so the bundle calls its OWN origin and the bundled
        # nginx proxies /api/ to the backend. Baking http://localhost:3456 here
        # made a remote browser call *itself*: the value was fixed at build time
        # but resolved against whatever machine opened the page.
        VITE_API_BASE_URL: ""
    container_name: beacon-frontend
    ports:
      - "9876:80"
    depends_on:
      - backend
    networks:
      - beacon-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  beacon-network:
    driver: bridge
