services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: beacon-postgres
    environment:
      POSTGRES_DB: beacon_db
      POSTGRES_USER: beacon_user
      POSTGRES_PASSWORD: beacon_password
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon_user -d beacon_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beacon-network
    restart: unless-stopped

  # Redis for Celery and caching
  redis:
    image: redis:7-alpine
    container_name: beacon-redis
    command: redis-server --appendonly yes --save 60 1 --loglevel warning
    sysctls:
      - net.core.somaxconn=511
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beacon-network
    restart: unless-stopped

  # Backend API (FastAPI)
  # Note: GPU support is configured via docker-compose.gpu.yml overlay
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.cpu  # Default to CPU for compatibility
    container_name: beacon-backend
    ports:
      - "3456:3456"
    environment:
      DATABASE_URL: postgresql://beacon_user:beacon_password@postgres:5432/beacon_db?client_encoding=utf8
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONPATH: /app
      PORT: 3456
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONIOENCODING: utf-8
      FRED_API_KEY: f0a1e5e0a4dc3272e4e95d3ec2ff3644
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      SEC_API_KEY: ${SEC_API_KEY:-}
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
      - ./models:/app/saved_models
      - ./logs:/app/logs
      - ./results:/app/results
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beacon-network
    restart: unless-stopped
    command: bash -c "sleep 10 && uvicorn api.main:app --host 0.0.0.0 --port 3456"

  # Celery Worker for background tasks
  # Note: GPU support is configured via docker-compose.gpu.yml overlay
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.cpu  # Default to CPU for compatibility
    container_name: beacon-celery-worker
    environment:
      DATABASE_URL: postgresql://beacon_user:beacon_password@postgres:5432/beacon_db?client_encoding=utf8
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONPATH: /app
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONIOENCODING: utf-8
      FRED_API_KEY: f0a1e5e0a4dc3272e4e95d3ec2ff3644
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      SEC_API_KEY: ${SEC_API_KEY:-}
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
      - ./models:/app/saved_models
      - ./logs:/app/logs
      - ./results:/app/results
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - beacon-network
    restart: unless-stopped
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=2

  # Frontend (React with Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3456
    container_name: beacon-frontend
    ports:
      - "6789:6789"
    environment:
      PORT: 6789
      VITE_API_BASE_URL: http://localhost:3456
    depends_on:
      - backend
    networks:
      - beacon-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  beacon-network:
    driver: bridge
