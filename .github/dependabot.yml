# Dependabot configuration for BEACON.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# STRATEGY (revised after Dependabot opened 9 PRs in four minutes and the
# grouped one could not build):
#
#   * github-actions  -> keep automatic. Low risk, high value, no application code.
#   * pip             -> SECURITY UPDATES ONLY. The scientific/ML stack moves as
#                        one coordinated migration, not as a bot PR.
#   * npm             -> SECURITY UPDATES ONLY. Dependabot's npm updater cannot
#                        resolve this dependency graph at all.
#   * docker          -> NO ENTRY. Base images are bumped deliberately by hand,
#                        and the image is built on demand, because nothing in CI
#                        builds it automatically any more.
#
# Why the pip/npm stacks are exempt from automatic bumps:
#   Dependabot classified torch 2.5.1->2.14.0, scipy 1.13->1.18, scikit-learn
#   1.5->1.9 and matplotlib 3.9->3.11 as *minor* updates and grouped them into a
#   single PR. That PR was not installable: scipy 1.18 requires numpy>=2.0 while
#   numpy was pinned to 1.26, and scikit-learn/matplotlib/scipy all require Python
#   >=3.12 while the image shipped 3.10. Resolving it required moving the Python
#   version and the numpy major together. Those are deliberate migrations, not
#   chores, so they are done by hand.
#
# Security updates are NOT affected by any `ignore` rule or by
# `open-pull-requests-limit`. They continue to open PRs under their own limit, so
# suppressing routine version noise does not cost us vulnerability alerts - for
# the ecosystems that support them. See the note at the foot of this file about
# docker, which does not support them at all.

version: 2

updates:
  # --- GitHub Actions -------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"

  # --- Python (backend) — SECURITY UPDATES ONLY ------------------------------
  #
  # `open-pull-requests-limit: 0` disables routine *version* updates for this
  # ecosystem while leaving *security* updates fully working (they have their
  # own internal limit and are not affected by this setting or by `ignore`).
  #
  # Evidence for the decision: the grouped minor/patch PR bumped torch
  # 2.5.1->2.14.0, scipy 1.13->1.18, scikit-learn 1.5->1.9 and matplotlib
  # 3.9->3.11 in one shot. That PR was unbuildable - scipy 1.18 needs numpy>=2.0
  # while numpy was pinned 1.26, and those three need Python>=3.12 while the
  # image shipped 3.10 - so it forced a coordinated Python and numpy migration.
  # The `ignore` list below narrows that risk, but the stack still needs a human
  # who can change the interpreter, the numpy major and the image together.
  #
  # To re-enable routine bumps: set this back to 3.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Compiled against a specific Python ABI and CUDA major; move with the
      # interpreter, not on a bot's schedule.
      - dependency-name: "torch"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "torch-geometric"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The scientific stack must move as a single coordinated unit: their
      # numpy/Python floors are coupled and cannot be satisfied one bump at a time.
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "scipy"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "scikit-learn"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "matplotlib"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # pandas/numpy ABI pairs up with the above; majors only, minors are safe.
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      # Framework majors are migrations (pydantic v2, sqlalchemy 2.0), not chores.
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "celery"
        update-types: ["version-update:semver-major"]
      # redis-py 5 -> 8 is three majors of client API change against a Celery
      # integration; it needs a deliberate upgrade, not a bot PR.
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]

  # --- JavaScript (frontend) — SECURITY UPDATES ONLY -------------------------
  #
  # 0 disables routine version updates here too; security updates still open PRs.
  #
  # Reason: Dependabot's npm updater cannot resolve this dependency graph. Every
  # scheduled run fails with
  #   npm error notarget No matching version found for
  #   @loaders.gl/worker-utils@4.5.1
  #   dependency_file_not_resolvable {message: "Error while updating peer dependency."}
  # while walking @tanstack/react-query's peers through deck.gl's large peer set.
  # A job that fails on every run and produces nothing is worse than no job, and
  # Frontend CI plus the Docker frontend image build already catch real breakage.
  #
  # To re-enable routine bumps: set this back to 3.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # React and Vite majors are framework migrations; deck.gl majors can break
      # the layer APIs. Take them deliberately.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # --- Base images: deliberately absent --------------------------------------
  #
  # There is no `docker` ecosystem entry for /backend or /frontend any more.
  #
  # Base images (python, nvidia/cuda, node, nginx) define the interpreter, the
  # CUDA line and the runtime contract the whole stack is compiled against, so
  # they move as deliberate, coordinated changes rather than on a bot's schedule.
  # The two entries that used to exist opened monthly patch PRs for tags that were
  # already pinned on purpose, and nothing in CI built the image, so the PR could
  # not be validated before merging.
  #
  # This costs no vulnerability coverage: Dependabot SECURITY updates do not
  # support the `docker` ecosystem - only version updates - per the supported-
  # ecosystems table (Docker: version updates yes, security updates no).
  # https://docs.github.com/en/code-security/reference/supply-chain-security/supported-ecosystems-and-repositories
  #
  # To bump a base image by hand: edit the Dockerfile, then build the real image
  # before merging it:
  #   gh workflow run docker-backend.yml  --ref main
  #   gh workflow run docker-frontend.yml --ref main

# NOTE: there is deliberately NO `docker` entry for the repository root either.
#
# Dependabot's docker ecosystem scans Dockerfiles and Kubernetes manifests - not
# docker-compose files - and there is no Dockerfile at the repo root. The
# previous `/` entry therefore failed on EVERY scheduled run with
#   "No Dockerfiles nor Kubernetes YAML found in /"
# It was removed rather than kept as a permanently red job.
#
# Consequence: the images referenced by docker-compose.yml (postgres/
# timescaledb, redis) are not covered by Dependabot either. Bump them by hand and
# validate with the `Docker backend image` workflow, which runs
# `docker compose config` before it builds. Both pin a major version whose upgrade
# needs a data migration, so an automated PR would not be actionable anyway.

