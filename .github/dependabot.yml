# Dependabot configuration for BEACON.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Strategy: small, reviewable PRs once a week. Minor and patch updates are grouped per
# ecosystem so they arrive as a single PR; major updates stay separate because they may
# contain breaking changes that need individual attention.
version: 2

updates:
  # --- Python dependencies (backend/requirements.txt and requirements-dev.txt) ---
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # --- JavaScript dependencies (frontend/package.json + package-lock.json) ---
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # --- GitHub Actions used by .github/workflows/** ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # --- Container base images in backend/Dockerfile and backend/Dockerfile.cpu ---
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-docker-images:
        patterns:
          - "*"

  # --- Container images referenced by docker-compose*.yml (postgres, redis) ---
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps)"
    groups:
      compose-docker-images:
        patterns:
          - "*"
