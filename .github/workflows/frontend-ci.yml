name: Frontend CI

# why: keep main green and validate every proposed frontend change before
# merge -- IN UNDER A MINUTE. This gate is static-only: install dependencies
# (usually restored from cache), strict-TypeScript the whole app, and audit
# the e2e mock's endpoint coverage. Everything that needs a browser or a
# bundler -- the production build and the Playwright suite -- lives in
# frontend-e2e.yml (nightly + manual dispatch), because a pre-merge check
# that takes ten minutes is a check nobody waits for. The full history of
# what each step catches is preserved in the two workflow files.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# why: cancel superseded runs on a branch or PR, but never on main - see the
# note in backend-ci.yml. Cancelling on main can leave a commit permanently
# unverified.
concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck and mock-coverage audit (Node 24)
    runs-on: ubuntu-latest
    # why: the whole point of this job is a sub-minute pre-merge signal.
    # A warm node_modules cache skips the install entirely; a miss is covered
    # by the npm cache setup-node keeps. The timeout is tight so a hung run
    # is killed quickly instead of burning runner minutes.
    timeout-minutes: 5

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # why: Node 24 is the current Active LTS (until 2028-04) and matches
          # the node:24-alpine base used by frontend/Dockerfile, so CI checks
          # on the same major as the shipped runtime.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore node_modules
        # why: `npm ci` is the slowest possible step in this job (~40-70s cold
        # on the runner's network). The tree is a pure function of the lockfile,
        # so keying the installed tree on its hash makes the common run
        # (lockfile unchanged) skip the install completely. Any action in this
        # repo runs on Node 24, so cache@v6 (node24) is the matching major.
        id: node-modules
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        env:
          # why: @playwright/test's install script fetches browser binaries.
          # This gate never launches a browser -- frontend-e2e.yml installs
          # chromium itself -- so the download is skipped to keep the install
          # inside the time budget.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: Typecheck TypeScript modules
        # The ratchet is complete: every module under frontend/src is .ts/.tsx
        # and all of it is checked under `strict` + `noUnusedLocals`. A
        # payload-shape drift between the backend and the typed interfaces in
        # frontend/src/types/api.ts fails here in seconds instead of surfacing
        # as an `undefined%` in production or an e2e surprise ten minutes in.
        run: npm run typecheck

      - name: Tailwind sees the source tree
        # why: a Tailwind `content` glob that matches nothing fails nothing --
        # the build succeeds with an (almost) empty stylesheet and the app
        # renders unstyled. That is not hypothetical: the TS migration renamed
        # every source file to .ts/.tsx while tailwind.config.js still globbed
        # {js,jsx}, and main shipped a 5.9 kB sheet until the nightly e2e run
        # tripped over the collapsed layout. This resolves the globs against
        # the real tree in ~0.2s and names the offending pattern.
        working-directory: .
        run: node scripts/check_tailwind_content.mjs

      - name: Every data-layer export has a consumer
        # why: the frontend sibling of backend/tests/test_reachability.py.
        # The untyped era accumulated twelve hooks with zero callers; they
        # were unmaintained contracts that drifted from the API with nothing
        # exercising them. A named value export of src/hooks, src/utils,
        # src/data or src/store that no other file references fails here in
        # milliseconds instead of rotting until the next migration audit.
        working-directory: .
        run: node scripts/check_frontend_hook_reachability.mjs

      - name: Every frontend endpoint is answered by the e2e mock
        # Runs in every gate, before any browser exists anywhere. An endpoint
        # the frontend calls and frontend/tests/apiMocks.js does not cover
        # falls through to the mock's deliberate "unknown GET path: answer 404,
        # as the real API does" branch, and because the e2e spec fails on any
        # console error the nightly suite would die at whatever assertion was
        # executing when the query retried -- not at the thing that is actually
        # missing. This names the endpoint instead. No browser, no daemon,
        # ~0.2s.
        # why: the job defaults to working-directory frontend, but the check
        # lives at the repository root (backend/tests/test_e2e_api_coverage.py
        # and the workflows README reference that path), so this one step runs
        # from the checkout root. The script resolves every path from its own
        # location, not the cwd.
        working-directory: .
        run: node scripts/check_e2e_api_coverage.mjs
