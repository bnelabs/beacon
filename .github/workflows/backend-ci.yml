name: Backend CI

# why: main must stay green, and every proposed change must be validated before merge.
# workflow_dispatch is added so a maintainer can re-run the suite on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# why: cancel superseded runs on a branch or PR, but NEVER on main. A cancelled
# main run leaves the commit unverified, and `workflow_dispatch` shares this
# concurrency group, so a manual dispatch could otherwise discard the only real
# run for that commit.
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # why: NO `services:` block and NO PostgreSQL service is needed. The suites are
  # self-contained:
  #   * backend/tests/conftest.py only ensures the repo root is on sys.path.
  #   * test_api_smoke.py forces SQLite (USE_SQLITE=true,
  #     DATABASE_URL=sqlite:///backend/tests/test_api.sqlite3) and talks to the app
  #     through FastAPI's in-process TestClient.
  #   * test_pipeline_integration.py points DATABASE_URL at a per-test SQLite file in
  #     tmp_path and drives the pipeline from a locally generated CSV.
  #   * test_country_scope.py is the only docker/Postgres/Redis-dependent test; it is
  #     skipped unless RUN_DOCKER_SCOPE_TESTS=1, which this workflow never sets.
  # A postgres:15 service would therefore add container startup time without exercising
  # a single additional test.
  test:
    name: Compile and test (Python 3.12)
    runs-on: ubuntu-latest
    # why: the CPU torch wheel plus the scientific stack makes this the slow leg;
    # 30 minutes leaves headroom on a cold uv cache while still bounding a hung job.
    timeout-minutes: 30
    env:
      # Install into the setup-python interpreter without a venv to keep the
      # commands below free of repeated --system flags.
      UV_SYSTEM_PYTHON: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # why: matches backend/Dockerfile.cpu (FROM python:3.12-slim) and the
          # python3.12 interpreter installed by backend/Dockerfile. The pinned
          # scientific stack (scipy 1.18, scikit-learn 1.9, matplotlib 3.11)
          # requires >= 3.12, so CI must not run an older interpreter than the
          # image ships.
          python-version: "3.12"

      - name: Set up uv
        # why: uv resolves and installs the pinned stack in seconds where pip
        # takes the better part of a minute, and its cache is keyed on the
        # requirements files so an unchanged stack is reused across runs.
        # Pinned to an exact version because this action publishes no floating
        # `v10` tag (only v10.0.0, v10.0.1, v10.1.0), so `@v10` fails to resolve.
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install CPU-only PyTorch
        # why: the default PyPI torch wheel pulls multi-GB CUDA runtime packages.
        # The CPU wheel index keeps the runner image small and the job fast on a
        # GPU-less runner. The version is read from requirements.txt rather than
        # hard-coded so the two can never drift apart again. Installing it first
        # means the requirements install below finds the pin already satisfied
        # and never re-fetches torch from PyPI.
        run: |
          TORCH_VERSION="$(grep -E '^torch==' backend/requirements.txt | head -1 | cut -d= -f3)"
          if [ -z "$TORCH_VERSION" ]; then
            echo "Could not determine the torch pin from backend/requirements.txt" >&2
            exit 1
          fi
          echo "Installing CPU-only torch==${TORCH_VERSION}"
          uv pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and dev dependencies
        run: uv pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Syntax gate (compileall)
        # why: a fast, dependency-light gate that fails on Python syntax errors before
        # the slower test collection step.
        run: python -m compileall -q backend

      - name: API docs are current
        # why: docs/api-endpoints.md is generated from the app's own OpenAPI schema.
        # The previous hand-written inventory drifted until seven of the fourteen
        # endpoints it documented did not exist, and nothing caught it because a
        # stale table still reads plausibly. This turns that silent failure into a
        # build failure. Import only — the app's lifespan, and therefore the
        # database, is never started.
        run: |
          PYTHONPATH=. python scripts/generate_api_docs.py --check

      - name: Render migrations offline
        # Catches unrenderable migration chains (import errors, bad op calls)
        # without a database; the baseline migration reconciles model metadata.
        run: |
          export DATABASE_URL=postgresql://user:pass@localhost:5432/db
          alembic upgrade head --sql > /dev/null

      - name: Run tests
        env:
          PYTHONUNBUFFERED: "1"
        # why: coverage instrumentation slows this suite by roughly 3.5x
        # (measured 0.63s -> 2.19s on the fastest modules). A pull request needs a
        # fast pass/fail signal, so coverage runs only on main and manual
        # dispatches, where the report and artifact are actually consumed.
        # pytest.ini no longer forces --cov, so this step fully controls it.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Pull request: running tests without coverage."
            python -m pytest backend/tests
          else
            echo "Running tests with coverage."
            python -m pytest backend/tests \
              --cov=backend \
              --cov-report=xml \
              --cov-report=html \
              --cov-report=term-missing
          fi

      - name: Upload coverage artifact
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

      - name: Ruff (advisory)
        # why: surfaces real defects (E9 syntax errors, F63/F7 undefined names, F82
        # unused values) without blocking merges on style. uses the ruff pin from
        # backend/requirements-dev.txt.
        continue-on-error: true
        run: ruff check backend --select E9,F63,F7,F82 --output-format=github
