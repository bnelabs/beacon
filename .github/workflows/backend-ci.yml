name: Backend CI

# why: main must stay green, and every proposed change must be validated before merge.
# workflow_dispatch is added so a maintainer can re-run the suite on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# why: a superseded run on the same ref produces no useful signal, so cancel it and
# reclaim runner minutes (especially valuable for the slow torch install).
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # why: NO `services:` block and NO PostgreSQL service is needed. The suites are
  # self-contained:
  #   * backend/tests/conftest.py only ensures the repo root is on sys.path.
  #   * test_api_smoke.py forces SQLite (USE_SQLITE=true,
  #     DATABASE_URL=sqlite:///backend/tests/test_api.sqlite3) and talks to the app
  #     through FastAPI's in-process TestClient.
  #   * test_pipeline_integration.py points DATABASE_URL at a per-test SQLite file in
  #     tmp_path and drives the pipeline from a locally generated CSV.
  #   * test_country_scope.py is the only docker/Postgres/Redis-dependent test; it is
  #     skipped unless RUN_DOCKER_SCOPE_TESTS=1, which this workflow never sets.
  # A postgres:15 service would therefore add container startup time without exercising
  # a single additional test.
  test:
    name: Compile and test (Python 3.10)
    runs-on: ubuntu-latest
    # why: the CPU torch wheel plus the scientific stack makes this the slow leg;
    # 30 minutes leaves headroom for a cold cache while still bounding a hung job.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # why: matches backend/Dockerfile.cpu (FROM python:3.10-slim) and the
          # python3.10 interpreter installed by backend/Dockerfile.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU-only PyTorch
        # why: the default PyPI torch==2.5.1 wheel pulls multi-GB CUDA runtime
        # packages. The CPU wheel index keeps the runner image small and the job fast
        # on a GPU-less runner. Installing torch first means the following
        # requirements install sees it already satisfied and never re-fetches it from
        # PyPI.
        run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and dev dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Syntax gate (compileall)
        # why: a fast, dependency-light gate that fails on Python syntax errors before
        # the slower test collection step.
        run: python -m compileall -q backend

      - name: Run tests with coverage
        env:
          PYTHONUNBUFFERED: "1"
        # why: the target and coverage flags are passed explicitly rather than relying
        # solely on the root pytest.ini. pytest.ini now uses the correct `[pytest]`
        # header and sets `testpaths = backend/tests`, but keeping the flags here makes
        # the CI invocation self-describing and immune to future config drift.
        run: |
          python -m pytest backend/tests \
            --cov=backend \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

      - name: Ruff (advisory)
        # why: surfaces real defects (E9 syntax errors, F63/F7 undefined names, F82
        # unused values) without blocking merges on style. uses the ruff pin from
        # backend/requirements-dev.txt.
        continue-on-error: true
        run: ruff check backend --select E9,F63,F7,F82 --output-format=github
