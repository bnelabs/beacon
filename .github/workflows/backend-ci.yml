name: Backend CI

# why: main must stay green, and every proposed change must be validated
# before merge -- IN UNDER A MINUTE. This gate runs the checks that need no
# dependency tree: a pure-stdlib syntax compile of every backend module, and
# the compose/Dockerfile validator (its only third-party import is PyYAML).
# The full suite -- uv-installed scientific stack, CPU torch, pytest, the
# live-migration PostgreSQL service, the generated-API-docs check -- runs in
# backend-tests.yml nightly and on demand, because installing torch alone
# costs more than the entire pre-merge budget. workflow_dispatch is kept here
# so a maintainer can re-run the fast gate on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# why: cancel superseded runs on a branch or PR, but NEVER on main. A
# cancelled main run leaves the commit unverified, and `workflow_dispatch`
# shares this concurrency group, so a manual dispatch could otherwise discard
# the only real run for that commit.
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  static-gates:
    name: Syntax and compose gates (Python 3.12)
    runs-on: ubuntu-latest
    # why: the budget is the feature. compileall is stdlib-only and takes
    # seconds; PyYAML is a single small wheel. Anything in this job that
    # approaches a minute is a bug in the job.
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: No build artifacts are tracked
        # why: a task-snapshot commit once replaced .gitignore with an LLM's
        # prose and a compiled analytics.cpython-312.pyc was committed into
        # the tree; the restored ignore rules prevent that at the filesystem
        # level, this prevents it at the index level. Milliseconds, stdlib
        # git only -- inside the sub-minute budget by construction.
        run: |
          tracked=$(git ls-files | grep -E '(__pycache__/|\.pyc$|\.pyo$|(^|/)beacon\.db|(^|/)dist/|node_modules/)' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Build artifacts are tracked in git; untrack them (git rm --cached):"
            echo "$tracked"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # why: matches backend/Dockerfile.cpu (FROM python:3.12-slim) and the
          # python3.12 interpreter installed by backend/Dockerfile, so the
          # syntax gate compiles on the interpreter the images ship.
          python-version: "3.12"

      - name: Syntax gate (compileall)
        # why: a fast, dependency-free gate that fails on Python syntax errors.
        # No import of the app happens here, so no torch, no FastAPI, no
        # database -- just the compiler walking every .py file.
        run: python -m compileall -q backend

      - name: Install PyYAML for the compose validator
        # why: scripts/validate_compose.py parses the merged compose YAML; its
        # only third-party import is `yaml`. Installing that one wheel keeps
        # the gate dependency-light -- the full requirements files (and the
        # multi-hundred-MB CPU torch wheel) belong to backend-tests.yml.
        run: python -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Validate the compose stack and Dockerfile COPY sources
        # No daemon needed: this parses the merged YAML for the base file and
        # both overlays, and checks every Dockerfile COPY source against the
        # build context. It is what catches `COPY backend/entrypoint.sh` under
        # `context: ./backend`, which cannot be built and was released anyway.
        # `docker compose config` in the manual docker-backend.yml workflow
        # still covers what only the real binary can.
        run: python scripts/validate_compose.py
