name: Docker backend image

# why: two very different costs live in this workflow, so they are gated
# separately.
#
#   * `compose-config` takes seconds and runs on every relevant push/PR.
#   * `build-backend` installs the whole ML stack into the image and takes about
#     5 minutes warm, 11 cold. It runs on a push to main and never on a pull
#     request, so review never waits on it. The `paths` filter below is what keeps
#     ordinary pushes fast: this workflow only triggers at all when a Dockerfile,
#     compose file or configs/ entry changed.
#
# Backend CI also installs the same requirements on the same Python 3.12
# interpreter, so a bad pin fails there in ~2 minutes without a build; the weekly
# run additionally catches base-image rot. Use "Run workflow" to prove a
# Dockerfile change before merging it.
on:
  push:
    branches: [main]
    paths:
      - "backend/Dockerfile*"
      - "docker-compose*.yml"
      - "configs/**"
      - ".github/workflows/docker-backend.yml"
  pull_request:
    paths:
      - "backend/Dockerfile*"
      - "docker-compose*.yml"
      - "configs/**"
      - ".github/workflows/docker-backend.yml"
  schedule:
    # Weekly, so base-image and Dockerfile rot is still found automatically.
    - cron: "23 5 * * 1"
  workflow_dispatch:

# why: never cancel on main - a cancelled run leaves the commit unverified.
concurrency:
  group: docker-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  compose-config:
    name: Validate compose files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate the base and both overlays
        # why: `docker compose config` resolves the YAML, interpolates every
        # ${VAR:-default}, and validates the merged service graph - the cheapest
        # check that catches a broken compose edit, in seconds. The overlays are
        # only meaningful combined with the base file, which is how they are used.
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          echo "All compose files are valid."

  build-backend:
    name: Build backend image (CPU)
    runs-on: ubuntu-latest
    # why: never on pull_request. This installs torch, torch-geometric and scipy
    # into the image and takes roughly 5 minutes warm (11 cold), and putting that
    # in front of a PR makes review wait on it.
    #
    # It DOES run on a push to main, but the workflow-level `paths` filter above
    # means only a push that actually touches a Dockerfile, compose file or
    # configs/ triggers this workflow at all. Ordinary pushes never reach here.
    #
    # Gating it off push as well was a mistake: a base-image bump merged with only
    # a stale pre-merge build behind it, and validating it then required starting
    # a 5-minute job by hand. Validating on the relevant pushes closes that gap
    # without putting a multi-minute build in front of anyone's pull request.
    if: github.event_name != 'pull_request'
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend CPU image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile.cpu
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
