name: Docker backend image

# why: two very different costs live in this workflow, so they are gated
# separately.
#
#   * `compose-config` takes seconds and runs on every relevant push/PR.
#   * `build-backend` installs the whole ML stack into the image and takes
#     7-11 minutes. Running that on every push put a multi-minute wait in front
#     of ordinary work, so it now runs on a schedule and on demand only.
#
# Nothing is lost that is not covered elsewhere: Backend CI installs the same
# requirements on the same Python 3.12 interpreter (so a bad pin fails there in
# ~2 minutes), and the weekly build catches Dockerfile and base-image breakage
# without blocking anyone. Use "Run workflow" when you want it before merging.
on:
  push:
    branches: [main]
    paths:
      - "backend/Dockerfile*"
      - "docker-compose*.yml"
      - "configs/**"
      - ".github/workflows/docker-backend.yml"
  pull_request:
    paths:
      - "backend/Dockerfile*"
      - "docker-compose*.yml"
      - "configs/**"
      - ".github/workflows/docker-backend.yml"
  schedule:
    # Weekly, so base-image and Dockerfile rot is still found automatically.
    - cron: "23 5 * * 1"
  workflow_dispatch:

# why: never cancel on main - a cancelled run leaves the commit unverified.
concurrency:
  group: docker-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  compose-config:
    name: Validate compose files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate the base and both overlays
        # why: `docker compose config` resolves the YAML, interpolates every
        # ${VAR:-default}, and validates the merged service graph - the cheapest
        # check that catches a broken compose edit, in seconds. The overlays are
        # only meaningful combined with the base file, which is how they are used.
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          echo "All compose files are valid."

  build-backend:
    name: Build backend image (CPU)
    runs-on: ubuntu-latest
    # why: NOT on push or pull_request. This installs torch, torch-geometric and
    # scipy into the image and takes 7-11 minutes; putting that in front of every
    # push made ordinary work wait on it. It is covered by the weekly schedule and
    # can be started manually from the Actions tab when a Dockerfile change needs
    # validating before merge.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend CPU image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile.cpu
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
