name: Docker backend image

# why: manual only. This workflow is the "build the real image" button, not a
# merge gate. It is not triggered by pushes, pull requests or a schedule, so no
# wait it creates can land in front of ordinary work. Start it from the Actions
# tab (Run workflow) when a Dockerfile, base image or compose change needs
# proving.
#
# What that gives up, deliberately: nothing validates a Dockerfile or base-image
# change automatically any more. Backend CI still installs the same requirements
# on the same Python 3.12 interpreter, so an uninstallable pin still fails there
# in ~2 minutes without a build; a broken Dockerfile or base image is found when
# someone runs this.
#
# Both jobs run on a dispatch: `compose-config` (seconds) validates the compose
# files, and `build-backend` (~5 minutes warm, up to 11 cold) builds the CPU
# image.
on:
  workflow_dispatch:

# why: never cancel on main - a cancelled run leaves the commit unverified.
concurrency:
  group: docker-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  compose-config:
    name: Validate compose files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate the base and both overlays
        # why: `docker compose config` resolves the YAML, interpolates every
        # ${VAR:-default}, and validates the merged service graph - the cheapest
        # check that catches a broken compose edit, in seconds. The overlays are
        # only meaningful combined with the base file, which is how they are used.
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          echo "All compose files are valid."

  build-backend:
    name: Build backend image (CPU)
    runs-on: ubuntu-latest
    # why: manual only (see the header). Nothing below runs automatically, so the
    # multi-minute build cannot sit in front of a push, a pull request or a review.
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend CPU image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile.cpu
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
