name: Docker backend image

# why: the Backend CI workflow tests the code on the runner's interpreter and
# never builds the container image. That gap is real, not theoretical: a
# Dependabot PR proposed `python:3.14-slim` for backend/Dockerfile.cpu, which
# passes every Python test (CI uses setup-python) but cannot build, because
# torch/numpy publish no cp314 wheels.
#
# This workflow is separate from the frontend image build on purpose. A single
# workflow with a shared `paths:` filter would rebuild this (expensive, torch
# install) image whenever a frontend file changed. Scoping the trigger to
# backend and compose paths keeps the cost proportional to the change.
#
# `backend/requirements*.txt` is deliberately NOT a trigger.
#
# Backend CI already installs the same file on the same Python 3.12 interpreter,
# so a requirements change that cannot install is caught there in ~2 minutes.
# Rebuilding this image for it cost ~10 minutes and fired on every Dependabot pip
# PR, which is exactly the kind of wait this workflow should not create.
# What actually needs a real build is a Dockerfile change - the base interpreter,
# apt packages, COPY layout - and those are rare and still validated on PRs.
on:
  push:
    branches: [main]
    paths:
      - "backend/Dockerfile*"
      - "docker-compose*.yml"
      - "configs/**"
      - ".github/workflows/docker-backend.yml"
  pull_request:
    paths:
      - "backend/Dockerfile*"
      - "docker-compose*.yml"
      - "configs/**"
      - ".github/workflows/docker-backend.yml"
  workflow_dispatch:

# why: never cancel on main - a cancelled run leaves the commit unverified.
concurrency:
  group: docker-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  compose-config:
    name: Validate compose files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate the base and both overlays
        # why: `docker compose config` resolves the YAML, interpolates every
        # ${VAR:-default}, and validates the merged service graph - the cheapest
        # check that catches a broken compose edit. The overlays are only
        # meaningful combined with the base file, which is how they are used.
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          echo "All compose files are valid."

  build-backend:
    name: Build backend image (CPU)
    runs-on: ubuntu-latest
    # why: installing the pinned ML stack (torch, torch-geometric, scipy) inside
    # the image is the slow leg. The build cache (type=gha, mode=max) means only
    # runs that actually change requirements pay the full cost.
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend CPU image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile.cpu
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
