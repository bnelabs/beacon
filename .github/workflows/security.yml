name: Security audit

# why: advisory dependency and supply-chain signal, and nothing else. Every
# step here is continue-on-error by design -- an audit has never been able to
# block a merge -- so running it on every push and PR only added queue time
# and a wall of green-but-slow checks in front of work. It now fires weekly
# (a newly published CVE surfaces within the week, which is exactly the
# cadence an advisory signal needs) and on demand.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        # why: the version is read from backend/requirements-dev.txt so the audit
        # tool cannot drift from the pinned dev dependency set (it previously
        # hard-coded 2.7.3 while requirements-dev.txt pinned 2.10.1).
        run: |
          PIP_AUDIT_VERSION="$(grep -E '^pip-audit==' backend/requirements-dev.txt | head -1 | cut -d= -f3)"
          if [ -z "$PIP_AUDIT_VERSION" ]; then
            echo "pip-audit is not pinned in backend/requirements-dev.txt" >&2
            exit 1
          fi
          python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"

      - name: Audit backend dependencies
        # why: advisory only. A new CVE must surface as a visible check but must not
        # block merges; remediation should land as a separate, reviewable dependency
        # bump.
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt

  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies
        # why: advisory only (see pip-audit note above). --audit-level=high keeps the
        # report focused on vulnerabilities that actually matter for merge decisions;
        # npm reads frontend/package-lock.json, so no install is required.
        continue-on-error: true
        run: npm audit --audit-level=high
