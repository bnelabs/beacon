name: Backend tests (deep)

# why: Split into parallel matrix jobs for 4x speedup. Tests are independent,
# so wall time drops from ~25min to ~6-8min.
on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Shared setup job - installs deps once, caches for all test shards
  setup:
    name: Setup Python & Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_SYSTEM_PYTHON: "1"
    outputs:
      python-version: ${{ steps.python.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install CPU-only PyTorch
        run: |
          TORCH_VERSION="$(grep -E '^torch==' backend/requirements.txt | head -1 | cut -d= -f3)"
          if [ -z "$TORCH_VERSION" ]; then
            echo "Could not determine the torch pin from backend/requirements.txt" >&2
            exit 1
          fi
          uv pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and dev dependencies
        run: uv pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - uses: actions/cache/save@v6
        with:
          key: backend-deps-${{ github.run_id }}
          path: |
            ~/.cache/uv
            /opt/hostedtoolcache/Python

  # Matrix of parallel test shards
  test-shard:
    name: Test Shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      UV_SYSTEM_PYTHON: "1"
      MIGRATION_TEST_DATABASE_URL: postgresql://beacon_user@127.0.0.1:5432/postgres
    services:
      postgres:
        image: timescale/timescaledb:2.15.2-pg15
        env:
          POSTGRES_USER: beacon_user
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beacon_user -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/cache/restore@v6
        with:
          key: backend-deps-${{ github.run_id }}
          path: |
            ~/.cache/uv
            /opt/hostedtoolcache/Python
          fail-on-cache-miss: true
      - name: Syntax gate
        run: python -m compileall -q backend
      - name: API docs check (shard 1 only)
        if: matrix.shard == 1
        run: PYTHONPATH=. python scripts/generate_api_docs.py --check
      - name: Render migrations offline (shard 1 only)
        if: matrix.shard == 1
        run: |
          export DATABASE_URL=postgresql://user:pass@localhost:5432/db
          alembic upgrade head --sql > /dev/null
      - name: Run test shard
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          TEST_FILES=(backend/tests/test_*.py)
          SHARD_SIZE=$(( (${#TEST_FILES[@]} + 3) / 4 ))
          START=$(( (matrix.shard - 1) * SHARD_SIZE ))
          SHARD_FILES=("${TEST_FILES[@]:$START:$SHARD_SIZE}")
          echo "Running tests: ${SHARD_FILES[*]}"
          python -m pytest "${SHARD_FILES[@]}" \
            --cov=backend \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            -n auto
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-shard-${{ matrix.shard }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14
      - name: Ruff advisory (shard 1 only)
        if: matrix.shard == 1
        continue-on-error: true
        run: ruff check backend --select E9,F63,F7,F82 --output-format=github

  # Aggregate results
  tests-complete:
    name: Backend Tests Complete
    runs-on: ubuntu-latest
    needs: [setup, test-shard]
    if: always()
    steps:
      - name: Check all shards passed
        run: |
          if [[ "${{ needs.test-shard.result }}" != "success" ]]; then
            echo "One or more test shards failed"
            exit 1
          fi
          echo "All backend test shards passed"
