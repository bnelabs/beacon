name: Frontend e2e (deep)

# why: Split into parallel matrix jobs for 3x speedup. Each shard runs
# independent test files, so wall time drops from ~20min to ~6-8min.
on:
  schedule:
    - cron: "26 3 * * *"
  workflow_dispatch:

concurrency:
  group: frontend-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Shared build job - produces dist/ for all test shards
  build:
    name: Build production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    outputs:
      build-hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - id: hash
        run: echo "hash=$(date +%s)" >> $GITHUB_OUTPUT
      - uses: actions/cache/save@v6
        with:
          key: frontend-build-${{ github.run_id }}
          path: frontend/dist

  # Matrix of parallel test shards
  test-shard:
    name: E2E Shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache/restore@v6
        with:
          key: frontend-build-${{ github.run_id }}
          path: frontend/dist
          fail-on-cache-miss: true
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-node24
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Install Playwright (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run shard ${{ matrix.shard }}
        env:
          CI: "true"
        run: |
          TEST_FILES=(frontend/tests/*.spec.js)
          SHARD_SIZE=$(( (${#TEST_FILES[@]} + 2) / 3 ))
          START=$(( (matrix.shard - 1) * SHARD_SIZE ))
          END=$(( matrix.shard * SHARD_SIZE - 1 ))
          SHARD_FILES=("${TEST_FILES[@]:$START:$SHARD_SIZE}")
          echo "Running tests: ${SHARD_FILES[*]}"
          npx playwright test "${SHARD_FILES[@]}" --workers=2
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Aggregate results
  e2e-complete:
    name: E2E Complete
    runs-on: ubuntu-latest
    needs: [build, test-shard]
    if: always()
    steps:
      - name: Check all shards passed
        run: |
          if [[ "${{ needs.test-shard.result }}" != "success" ]]; then
            echo "One or more test shards failed"
            exit 1
          fi
          echo "All E2E shards passed"
