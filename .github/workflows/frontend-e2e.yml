name: Frontend e2e (deep)

# why: Maximum parallelization - each test file runs in its own job.
# With 3 files and generous runners, wall time drops to ~3-4min.
on:
  schedule:
    - cron: "26 3 * * *"
  workflow_dispatch:

concurrency:
  group: frontend-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Shared build job - produces dist/ for all test jobs
  build:
    name: Build production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/cache/save@v6
        with:
          key: frontend-build-${{ github.run_id }}
          path: frontend/dist

  # One job per test file - maximum parallelism
  test-dashboard:
    name: E2E Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache/restore@v6
        with:
          key: frontend-build-${{ github.run_id }}
          path: frontend/dist
          fail-on-cache-miss: true
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-node24
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install-deps chromium || true
      - run: npx playwright test tests/dashboard.spec.js --workers=2
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-dashboard
          path: frontend/test-results/
          retention-days: 3

  test-pages:
    name: E2E Pages
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache/restore@v6
        with:
          key: frontend-build-${{ github.run_id }}
          path: frontend/dist
          fail-on-cache-miss: true
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-node24
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install-deps chromium || true
      - run: npx playwright test tests/pages.spec.js --workers=2
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-pages
          path: frontend/test-results/
          retention-days: 3

  test-search:
    name: E2E Search
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache/restore@v6
        with:
          key: frontend-build-${{ github.run_id }}
          path: frontend/dist
          fail-on-cache-miss: true
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-node24
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install-deps chromium || true
      - run: npx playwright test tests/search.spec.js --workers=2
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-search
          path: frontend/test-results/
          retention-days: 3

  e2e-complete:
    name: E2E Complete
    runs-on: ubuntu-latest
    needs: [build, test-dashboard, test-pages, test-search]
    if: always()
    steps:
      - run: |
          if [[ "${{ needs.test-dashboard.result }}" != "success" || \
                "${{ needs.test-pages.result }}" != "success" || \
                "${{ needs.test-search.result }}" != "success" ]]; then
            echo "One or more E2E tests failed"
            exit 1
          fi
          echo "All E2E tests passed"
