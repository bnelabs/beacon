name: Docker frontend image

# why: manual only, for the same reason as the backend image workflow - no wait it
# creates can land in front of ordinary work. Start it from the Actions tab (Run
# workflow) when a frontend Dockerfile, package.json or lockfile change needs
# proving inside the real image.
#
# The distinction this workflow exists to catch still matters even though it is no
# longer automatic: Frontend CI runs `npm ci && npm run build` on the runner, which
# is NOT the same as building the container image. The image previously used
# `npm install --legacy-peer-deps`, which skips peer dependencies, so
# `@deck.gl/widgets` was missing and the image build failed with
# "Rollup failed to resolve import '@deck.gl/widgets'" while Frontend CI stayed
# green. Only building the real image catches that class of failure.
on:
  workflow_dispatch:

# why: never cancel on main - a cancelled run leaves the commit unverified.
concurrency:
  group: docker-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: false
          build-args: |
            VITE_API_BASE_URL=http://localhost:3456
          cache-from: type=gha
          cache-to: type=gha,mode=max
