[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Coverage is deliberately NOT enabled here.
#
# Instrumentation slows this suite by roughly 3.5x (measured: 0.63s -> 2.19s on
# the fastest modules), and putting it in addopts forced it on every local run
# and on every CI job with no way to opt out from the command line.
# The Backend CI workflow enables it explicitly where it is wanted (main).
addopts =
    --verbose
    --tb=short
