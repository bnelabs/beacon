model:
  # Model architecture
  hidden_dim: 64
  heads: 8
  num_funds: 10  # Configurable number of funds for embeddings
  
  # Training parameters
  epochs: 100
  batch_size: 16
  learning_rate: 0.0001
  dropout_rate: 0.3
  lstm_hidden_size: 256
  gradient_clip_norm: 1.0

simulation:
  low_liquidity_threshold: 0.2

funds:
  major_funds:
