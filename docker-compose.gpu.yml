# GPU-specific configuration for Linux with an NVIDIA GPU
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
#
# Only `backend` carries a build. `migrate` and `celery-worker` declare the same
# `image:` tag in docker-compose.yml and no build of their own, so the one image
# built here is the image all three run — which is the point. This file used to
# repeat the whole build block for celery-worker, so `docker compose build`
# downloaded the multi-GB CUDA torch wheel twice and produced two images that
# could drift apart. On a single host that is what filled a 17 GB BuildKit cache.
#
# Two variables that are easy to conflate, and were:
#
#   NVIDIA_VISIBLE_DEVICES  read by the NVIDIA container runtime to decide which
#                           GPUs to pass into the container. Accepts `all`,
#                           `none`, or indices.
#   CUDA_VISIBLE_DEVICES    read by CUDA/PyTorch *inside* the container. Accepts
#                           indices or UUIDs — NOT `all`. Setting it to `all`
#                           does not mean "every GPU"; torch parses it as a
#                           device list, matches nothing, and reports
#                           torch.cuda.is_available() == False in a container
#                           that can see the GPU perfectly well.
#
# The image used to bake `CUDA_VISIBLE_DEVICES=all` in as its default and this
# overlay passed `${CUDA_VISIBLE_DEVICES:-all}` to it, which is exactly that
# failure: an RTX 3090 visible to `nvidia-smi` in the container and invisible to
# torch. The build arg now defaults to `0`, and a multi-GPU host pins the list
# explicitly from .env (CUDA_VISIBLE_DEVICES=0,1).

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile  # Use GPU Dockerfile
      args:
        CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
    environment:
      # Runtime, and the value PyTorch actually reads. Indices only.
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      # Container-level GPU selection. `all` is correct here and wrong above.
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  celery-worker:
    environment:
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
