# Pre-registered early-warning evaluation — protocol v2 (FROZEN)
#
# Machine-readable half of docs/prereg/early_warning_v2.md. Committed and
# git-tagged `prereg-early-warning-v2` BEFORE the evaluation runs. After the
# tag, any change requires protocol v3 plus a CHANGELOG entry.
# scripts/run_preregistered_eval.py --protocol v2 mirrors these constants; on
# disagreement, this file and the tag win.

protocol: early_warning_v2
supersedes: early_warning_v1
status: frozen-pending-run

# --- WHAT CHANGED FROM v1 (and what deliberately did not) -------------------
# v1's published run graded ONE indicator and returned NO -- with the
# diagnosis written into its report: the registry family skews to
# operator-reported and low-frequency series, so the test was under-powered
# by construction. v2 fixes the diagnosed flaw and nothing else:
#   CHANGED:   family curation (two literature-backed daily series added),
#              licence screening rule, keyed FRED transport with redaction.
#   UNCHANGED: every evaluation criterion, the labelling parameters, the
#              alarm rule, the model config and seed, the windows, the
#              baselines, the permutation test, the Holm-Bonferroni level,
#              the minimum testable family, the single-run rule. The runner
#              enforces this by construction: one shared set of constants,
#              one shared evaluation path for every protocol version.
#              Adjusting a criterion after seeing v1's numbers would be
#              moving goalposts; this protocol does not.
# ---------------------------------------------------------------------------

# --- windows (identical to v1) ---
train_end: "2006-12-31"
eval_start: "2007-01-01"
eval_end: "2024-12-31"

# --- labelling (identical to v1) ---
labelling:
  quantile: 0.95
  horizon: 21
  min_duration: 5
  decay: 0.5
  threshold_span: full evaluation window (declared historical mode)
  direction: per-indicator, from backend/modules/data/semantics.py (None = skip)

# --- scoring (identical to v1) ---
scoring:
  step: one business day (daily series only)
  sign_adjustment: scores multiplied by +1 (direction up) or -1 (direction down)
  alignment: labels joined to scores via RiskSeriesResult.frame['row_offset']
  alarm_rule: score >= quantile(score, 0.95) over the evaluation span
  max_lead: 42

# --- model (identical to v1, seed included) ---
model:
  type: temporal_attention
  epochs: 15
  sequence_length: 30
  batch_size: 64
  d_model: 16
  nhead: 2
  num_layers: 1
  dropout: 0.0
  learning_rate: 0.001
  mixed_precision: false
  training_seed: 11

# --- baselines (identical to v1) ---
baselines: [persistence, ar1]

# --- criteria (identical to v1 -- frozen since before v1's run) ---
criteria:
  min_median_lead_business_days: 10
  max_false_alarms_per_quiet_year: 4
  beat_baselines: AUC and AP strictly above BOTH persistence and AR(1)
  ap_above_base_rate: true
  significance: permutation p (1000 shuffles, seed 20260917) surviving
    Holm-Bonferroni at alpha 0.05 across the tested family

# --- transport and credentials (new in v2, data-availability mechanics only) ---
transport:
  plugin: the platform's own fred_plugin
  api_key: FRED_API_KEY read from the environment at run time; NEVER written
    to any file. Recorded endpoints carry api_key=<redacted>. Committed
    provenance is the CSV bytes + SHA-256, not the credential.
  licence_screen: before downloading, read each candidate's FRED series
    notes and skip any whose terms prohibit reproduction/redistribution
    (the repository commits fetched series as provenance; committing
    prohibited data would make the provenance store itself the violation --
    observed fact -- ICE BofA's terms for BAMLH0A0HYM2, which is why v1's
    capture of that series was removed; see data/prereg/REMOVAL_NOTE.md)

# --- family v2 ---
family:
  candidates:                       # rules re-derive every skip at fetch time
    FRED_STLFSI4: { source: fred, series_id: STLFSI4 }
    FRED_KCFSI:   { source: fred, series_id: KCFSI }
    FRED_SOFR:    { source: fred, series_id: SOFR }
    FRED_BAMLH0A0HYM2: { source: fred, series_id: BAMLH0A0HYM2 }
    FRED_T10Y2Y:  { source: fred, series_id: T10Y2Y }
    ECB_CISS:     { source: fred, series_id: CISS }
    # New in v2 -- selection rationale declared BEFORE any v2 fetch:
    FRED_T10Y3M:  { source: fred, series_id: T10Y3M,
                    rationale: "the short-end curve spread the yield-curve/recession literature documents (Harvey et al.; Engstrom); public-domain Treasury/Fed data; full history from 1982" }
    FRED_VIXCLS:  { source: fred, series_id: VIXCLS,
                    rationale: "the standard equity-stress gauge; FRED serves it 'reprinted with permission' with no reproduction prohibition (notes checked 2026-09-17); full history from 1990" }
  excluded:
    FRED_RRPONTSYD: "owner decision carried from v1 (proposal section 6): the registry flags its direction as a funding-sense judgement"
    HQLA_LEVEL: "operator-reported series; no public source in the evaluation environment"
    LCR_RATIO: "operator-reported series; no public source in the evaluation environment"
    NSFR_RATIO: "operator-reported series; no public source in the evaluation environment"
    BANK_EQUITY_INDEX: "operator-reported series; no public source in the evaluation environment"
    FX_SWAP_BASIS: "operator-reported series; no public source in the evaluation environment"
    CDS_PREMIUM: "operator-reported series; no public source in the evaluation environment"

# --- skip rules (v1's set plus the licence screen; all pre-metric) ---
skip_rules:
  licence_prohibits_reproduction: series notes prohibit reproduction/redistribution (screened before download)
  fetch_failed: the plugin raised or returned empty
  frequency_not_daily: median observation gap > 1.5 days (weekly/monthly tracks are declared v3 work)
  insufficient_coverage: eval-window coverage < 0.60 of business days, or < 3 of the 7 declared episodes fully covered
  quality_gate_failed: the platform's real quality gate did not verify the payload
  no_events_in_window: the labeller found no event episode in the evaluation span
# NONE of the skip rules may depend on a metric value.

# --- family verdict (identical to v1) ---
family_verdict:
  min_testable_family: 3
  pass_rule: at least half of the tested indicators pass ALL criteria (Holm-adjusted)

# --- run rules (identical to v1) ---
run_rules:
  single_run: one evaluation run per tagged protocol; re-runs only for documented infrastructure defects, logged with their diffs
  negative_results: published unchanged
  sensitivity: post-run exploration is reported separately, never retro-fitted
  execution: in-process (declared deviation); mirrors run_backtest's event idiom
  episodes: identical to v1 (see configs/event_eval_v1.yaml)
