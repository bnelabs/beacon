# Pre-registered early-warning evaluation — protocol v1 (FROZEN)
#
# This file is the machine-readable half of docs/prereg/early_warning_v1.md.
# It is committed and git-tagged `prereg-early-warning-v1` BEFORE the
# evaluation runs. After the tag, any change requires a new version (v2) and
# a CHANGELOG entry stating what changed and why. scripts/run_preregistered_eval.py
# mirrors these constants; on disagreement, this file and the tag win.

protocol: early_warning_v1
status: frozen-pending-run          # flipped to executed only by the run report
proposal: docs/probes/event_target_proposal.md
runner: scripts/run_preregistered_eval.py

# --- windows (chronological holdout; the model never sees the eval span) ---
train_end: "2006-12-31"
eval_start: "2007-01-01"
eval_end: "2024-12-31"

# --- event labelling (existing EventDefinition knobs; labels see the future
# --- by construction, features never do) ---
labelling:
  quantile: 0.95                    # of the horizon-move distribution, stress direction
  horizon: 21                       # business-day steps the move accumulates over
  min_duration: 5                   # consecutive crossing steps to constitute an event
  decay: 0.5                        # labeller default
  threshold_span: full evaluation window (declared historical mode)
  direction: per-indicator, from backend/modules/data/semantics.py (None = skip)

# --- scoring ---
scoring:
  step: one business day (daily series only; frequency measured at fetch, pre-metrics)
  sign_adjustment: scores multiplied by +1 (direction up) or -1 (direction down)
    so higher always means more stress; baselines receive the identical adjustment
  alignment: labels joined to scores via RiskSeriesResult.frame['row_offset']
    (the documented contract), never by truncation
  alarm_rule: score >= quantile(score, 0.95) over the evaluation span
    (the run_backtest idiom)
  max_lead: 42                      # 2 * horizon, run_backtest convention

# --- model (frozen; small by design so the run fits a 2-CPU host) ---
model:
  type: temporal_attention
  epochs: 15
  sequence_length: 30
  batch_size: 64
  d_model: 16
  nhead: 2
  num_layers: 1
  dropout: 0.0
  learning_rate: 0.001
  mixed_precision: false
  training_seed: 11
  normalisation: training-span mean/std attached to the checkpoint as source_stats

# --- baselines (identical grid, identical alarm rule) ---
baselines:
  - persistence: sign-adjusted standardized level ("stress continues")
  - ar1: OLS on the training span's standardized series, applied to the eval span

# --- criteria (ALL must hold for an indicator to pass) ---
criteria:
  min_median_lead_business_days: 10
  max_false_alarms_per_quiet_year: 4     # quiet year = 252 non-event steps
  beat_baselines: AUC and AP strictly above BOTH persistence and AR(1)
  ap_above_base_rate: true
  significance: permutation p (1000 label shuffles, seed 20260917) surviving
    Holm-Bonferroni at alpha 0.05 across the tested family

# --- family (every semantics-registry code, dispositioned BEFORE any fetch) ---
family:
  testable_candidates:               # public daily-frequency sources attempted
    FRED_STLFSI4: { source: fred, series_id: STLFSI4 }
    FRED_KCFSI:   { source: fred, series_id: KCFSI }
    FRED_SOFR:    { source: fred, series_id: SOFR }
    FRED_BAMLH0A0HYM2: { source: fred, series_id: BAMLH0A0HYM2 }
    FRED_T10Y2Y:  { source: fred, series_id: T10Y2Y }
    ECB_CISS:     { source: fred, series_id: CISS, note: one declared keyless attempt; no substitute improvised }
  excluded:
    FRED_RRPONTSYD: "owner decision (proposal section 6) -- the registry itself
      flags its direction as a funding-sense judgement"
    HQLA_LEVEL: operator-reported series; no public source in the evaluation environment
    LCR_RATIO: operator-reported series; no public source in the evaluation environment
    NSFR_RATIO: operator-reported series; no public source in the evaluation environment
    BANK_EQUITY_INDEX: operator-reported series; no public source in the evaluation environment
    FX_SWAP_BASIS: operator-reported series; no public source in the evaluation environment
    CDS_PREMIUM: operator-reported series; no public source in the evaluation environment

# --- declared data-availability skip rules (applied BEFORE any metric) ---
skip_rules:
  fetch_failed: the platform's own FRED plugin (keyless fredgraph.csv) raised or returned empty
  frequency_not_daily: median observation gap in the fetched history > 1.5 days
    (weekly/monthly series would need a resampling rule; inventing one mid-run
    is a researcher degree of freedom -- declared v2 work instead)
  insufficient_coverage: eval-window coverage < 0.60 of business days, or fewer
    than 3 of the 7 declared episodes fully inside the covered eval span
  quality_gate_failed: the platform's real quality gate did not verify the payload
  no_events_in_window: the labeller found no event episode in the evaluation span
# NONE of the skip rules may depend on a metric value; they are all
# data-availability facts established before any model runs.

# --- family verdict ---
family_verdict:
  min_testable_family: 3             # fewer tested => no system-level claim, ever
  pass_rule: at least half of the tested indicators pass ALL criteria (Holm-adjusted)

# --- run rules ---
run_rules:
  single_run: one evaluation run per tagged protocol; re-runs only for documented
    infrastructure defects, each logged with its diff
  negative_results: published unchanged; the README claim gate only moves on a
    passing run of a tagged protocol
  execution: v1 runs in-process (declared deviation); computation mirrors
    run_backtest's event idiom with the corrected alignment and sign handling
  cpcv: chronological holdout in v1; CPCV is the declared v2 upgrade

# --- declared episode family (context/sanity; labels remain endogenous) ---
episodes:
  E1_gfc:            ["2007-08-01", "2009-03-31"]
  E2_euro_area:      ["2010-05-01", "2012-07-31"]
  E3_em_outflows:    ["2015-08-01", "2016-02-29"]
  E4_repo_spike:     ["2019-09-15", "2019-10-15"]
  E5_dash_for_cash:  ["2020-02-20", "2020-04-15"]
  E6_uk_ldi:         ["2022-09-23", "2022-10-31"]
  E7_regional_banks: ["2023-03-08", "2023-05-31"]
