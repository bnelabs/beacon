# =============================================================================
# BEACON — Grafana dashboard provider provisioning (observability workstream F)
# =============================================================================
# Mounted at /etc/grafana/provisioning/dashboards/dashboards.yml
#
# The provider scans /etc/grafana/dashboards, which docker-compose mounts from
# ./configs/observability/grafana/dashboards (read-only).  That path is used
# instead of the more common /var/lib/grafana/dashboards on purpose: the Grafana
# state volume is mounted at /var/lib/grafana, and keeping provisioned dashboards
# outside of it avoids a nested bind mount inside a named volume.
# Dropping a valid Grafana dashboard JSON in that directory is enough to have it
# appear under the "BEACON" folder within `updateIntervalSeconds`.
# =============================================================================

apiVersion: 1

providers:
  - name: BEACON
    orgId: 1
    folder: BEACON
    folderUid: beacon
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
