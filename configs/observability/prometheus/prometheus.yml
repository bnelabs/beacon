# =============================================================================
# BEACON — Prometheus scrape configuration (observability workstream F)
# =============================================================================
#
# HOW CELERY WORKER METRICS ARE EXPOSED — EXACTLY ONE APPROACH
# ------------------------------------------------------------
# DECISION: a DEDICATED EXPORTER SERVICE (`celery-exporter`, image
# `danihodovic/celery-exporter`) subscribes to the broker event stream and is
# scraped as the `celery-exporter` job below.
#
# Why this one and not the alternatives:
#   * Pushgateway — rejected.  A Pushgateway cannot express "how many workers are
#     alive": the `up`/`== 0` semantics needed for the "zero live workers" alert
#     do not exist for pushed metrics, and stale pushes keep looking healthy.
#   * Worker-embedded HTTP endpoint (e.g. `celery-prometheus-exporter` sidecar in
#     the worker image, or `PROMETHEUS_MULTIPROC_DIR` + an HTTP handler inside the
#     worker) — rejected for the *primary* path: it requires modifying the worker
#     image and process management for every pool, and the exporter already
#     provides task/queue/worker metrics without touching worker code.
#
# The `PROMETHEUS_MULTIPROC_DIR` support in `backend/monitoring/metrics.py` is
# documented and kept working, but it is the *optional*/secondary path and is
# deliberately NOT listed as a scrape target here so that there is exactly one
# way Celery worker metrics reach Prometheus.
#
# The backend API process still publishes BEACON-native application metrics at
# `/metrics` (HTTP, pipeline, ingestion, drift, inference, predictions) and
# additionally samples Celery queue depth + worker liveness through the Celery
# control API at scrape time (`beacon_celery_queue_depth`,
# `beacon_celery_workers_online`).  That sampling happens *inside the API
# process* — it is not a worker-side HTTP endpoint, so it does not compete with
# the exporter decision.  Alert rules reference the exporter series first and
# fall back to the BEACON-native series with `or`, so they work in either
# deployment shape.
#
# Config paths are mounted at /etc/prometheus by docker-compose:
#   ./configs/observability/prometheus -> /etc/prometheus (read-only)
# =============================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    monitor: beacon
    environment: local

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # ---------------------------------------------------------------------------
  # Prometheus itself (useful for self-health panels/alerts)
  # ---------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  # ---------------------------------------------------------------------------
  # BEACON FastAPI backend — application metrics
  #   /metrics is wired in backend/api/main.py via
  #   backend.monitoring.metrics.setup_metrics(app)
  # ---------------------------------------------------------------------------
  - job_name: beacon-backend
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["backend:3456"]
        labels:
          service: beacon-backend
          component: api
          env: local

  # ---------------------------------------------------------------------------
  # Celery worker/task/queue metrics — THE chosen approach (dedicated exporter).
  # The exporter talks to the same Redis broker as the workers; it needs no
  # change to the worker command line and no shared multiprocess directory.
  # ---------------------------------------------------------------------------
  - job_name: celery-exporter
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["celery-exporter:9808"]
        labels:
          service: beacon-celery
          component: worker
          env: local

  # ---------------------------------------------------------------------------
  # Celery broker (Redis) — exporter for Redis-side queue/list metrics.
  # Purely additive broker health; the queue-depth alert primarily uses
  # `celery_queue_length` / `beacon_celery_queue_depth`.
  # Uncomment together with the `redis-exporter` service from the compose snippet
  # if you deploy it.
  # ---------------------------------------------------------------------------
  # - job_name: redis-exporter
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]
  #       labels:
  #         service: beacon-redis
