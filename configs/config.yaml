model:
  hidden_dim: 512
  heads: 8
  num_funds: 10
  epochs: 100
  batch_size: 16
  learning_rate: 0.0001
  dropout_rate: 0.3
  lstm_hidden_size: 256
  gradient_clip_norm: 1.0
  num_heads: 16
  num_layers: 3
  dropout: 0.15
backtesting:
  start_year: 2010
  end_year: 2023
simulation:
  low_liquidity_threshold: 0.2
funds:
  major_funds:
  - name: BlackRock
    cik: 0001067983
  - name: Vanguard
    cik: 0000102909
  - name: Fidelity
