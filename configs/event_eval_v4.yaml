# Pre-registered early-warning evaluation — protocol v4 (FROZEN)
#
# Machine-readable half of docs/prereg/early_warning_v4.md. Committed and
# git-tagged `prereg-early-warning-v4` BEFORE the evaluation runs. After the
# tag, any change requires protocol v5 plus a CHANGELOG entry. Runner:
# scripts/run_preregistered_eval.py --protocol v4. On disagreement between
# this file and the runner, this file and the tag win.

protocol: early_warning_v4
supersedes: early_warning_v3
status: frozen-pending-run

# --- WHY v4 EXISTS (the recorded resumption conditions, nothing else) ------
# v3's terminal clause parked the line with two RECORDED v4 axes:
#   1. rolling refits — the discipline the hazard architecture actually needs
#      (v3's frozen hazard logit failed out-of-sample, AUC 0.39/0.44: an
#      18-year extrapolation of a pre-2006 fit does not survive the QE-era
#      regime change);
#   2. weekly/monthly tracks admitting the credit-gap family (the
#      literature's best EWS variables are not daily, and v1-v3 froze a
#      daily step, so they could never enter the family).
# v4 tests exactly those two axes. Resumption is owner-initiated (given in
# chat 2026-09-18, "ok do all", following the recorded-axes recommendation).
# NO grading criterion changes: the four frozen criteria, the labeller
# quantile, the windows, the permutation test, the Holm level, the minimum
# testable family, the family rule and the single-run rule are identical to
# v1/v2/v3 by shared code, not by promise.

# --- windows (identical to v1/v2/v3) ---
train_end: "2006-12-31"
eval_start: "2007-01-01"
eval_end: "2024-12-31"

# --- labelling (quantile identical; horizon/min_duration per declared track)
labelling:
  quantile: 0.95
  direction: per-indicator, from backend/modules/data/semantics.py (declared
    BEFORE any v4 fetch; BIS_CREDIT_GAP_US added 2026-09-18 with rationale)
  threshold_span: full evaluation window (declared historical mode)

# --- tracks (NEW in v4; the daily row restates the frozen v1-v3 constants) -
# Each row translates the SAME design intent onto its grid at the coarsest
# granularity the grid can express: ~21-business-day move horizon, ~5-bd
# persistence, >=10-bd median-lead floor, ~one-quarter hazard lookback.
tracks:
  daily:      {horizon: 21, min_duration: 5, max_lead: 42, min_median_lead: 10,
               steps_per_year: 252, hazard_lookback: 63, bd_per_step: 1}
  weekly:     {horizon: 4,  min_duration: 1, max_lead: 8,  min_median_lead: 2,
               steps_per_year: 52,  hazard_lookback: 13, bd_per_step: 5}
  quarterly:  {horizon: 1,  min_duration: 1, max_lead: 2,  min_median_lead: 1,
               steps_per_year: 4,   hazard_lookback: 1,  bd_per_step: 63}
  declared_consequences:
    - weekly lead floor = 2 steps ~ 10 business days (the frozen intent)
    - quarterly lead floor = 1 step ~ 63 business days — STRICTER than the
      10-bd intent; quarterly horizon (1 step ~ 63 bd) is COARSER than the
      21-bd intent — the coarsest the grid expresses, declared not hidden
    - frequency is verified per track at fetch (weekly band / quarterly band);
      a series whose measured cadence does not match its declared track is a
      data-availability skip, never resampled

# --- family (v2's dispositions re-derived on a fresh fetch, PLUS the
# --- probe-GREEN quarterly candidate; probe: docs/probes/prereg_v4_source_probe.md)
family:
  daily track: FRED_T10Y2Y, FRED_T10Y3M, FRED_VIXCLS (as v2/v3)
  weekly track: FRED_STLFSI4, FRED_KCFSI (registry directions predate v4);
    ECB_CISS keeps its declared v1-style keyless FRED attempt — the probe
    found the ECB data-API flow mis-resolves (ECB_FMD2) and the legacy SDW
    host does not connect, so its skip will be RECORDED, not substituted
  quarterly track: BIS_CREDIT_GAP_US = WS_CREDIT_GAP/Q.US.P.A.C.E (gap, not
    level; US private non-financial; quarterly 1957-Q4 onward; keyless;
    licence GREEN with attribution)
  dispositions re-derived at fetch (never skipped from memory): FRED_SOFR
    (coverage), FRED_BAMLH0A0HYM2 (licence), FRED_RRPONTSYD (owner
    exclusion), six operator-reported codes (no public source)
  excluded_pre_fetch:
    BIS_DEBT_SERVICE_RATIO: >-
      BIS debt service ratio (WS_DSR/Q.US) was probed keyless and fetchable
      but YELLOW — US history starts 1999-Q1, ~32 pre-2007 quarters, below
      any honest fit for the declared architecture (the TAN's
      sequence_length alone is 30 steps). Excluded by the probe's declared
      disposition rule BEFORE any v4 metric, recorded here rather than
      discovered mid-run.

# --- alarm rule (uniform quantile; per-track arithmetic from PUBLISHED facts)
alarm:
  score_quantile: 0.98
  applies_to: every scorer AND both baselines, identically, on the scorer's
    own declared grid
  arithmetic_declared_pre_run:
    daily: "~5.0 alarms/yr; FA ceiling 4 needs precision >= ~20% — v3 measured
      23-29% at q98 for two of three indicators: demanding but reachable
      (identical arithmetic to v3's frozen declaration)"
    weekly: "~1.0 alarm/yr => FA <= 1.0 x (1-p) < 4 for ANY precision: the
      ceiling cannot bind; lift and lead are the binding criteria"
    quarterly: "top 2% of ~72 scores = 1-2 alarms in the whole 18-year window
      => ceiling cannot bind; lift and lead are the binding criteria"

# --- scorers (four declared; frozen two reproduce v3 on unchanged sources) --
scorers:
  tan_frozen: identical to v1/v2/v3 (config, seed 11, <=2007 train span —
    the run's own reproducibility check against v3 on unchanged sources)
  hazard_logit: identical to v3 (features, labels, estimator defaults,
    absence rule) with the per-track hazard_lookback
  tan_rolling (NEW): same architecture/config/seed protocol; refit at every
    calendar-year boundary on the EXPANDING window of rows strictly before
    the boundary (strictly causal); sequence_length rows of PAST
    observations warm up each year's predictions; a boundary whose window
    cannot support the fit (< sequence_length + 10 rows) contributes NO
    scores — declared absence, not zero
  hazard_logit_rolling (NEW): same feature/estimator spec as hazard_logit;
    refit at every boundary with mean/std and onset labels recomputed from
    the window strictly before it; a year with no training-span onsets
    contributes NO scores (the frozen refusal rule, per refit)
  per_scorer_grids: rolling scorers cover eval steps the frozen TAN's
    eval-only warm-up drops; EACH scorer is graded against baselines
    recomputed on its own grid (declared; v1-v3 keep the single shared grid)

# --- baselines (identical definitions; recomputed per scorer grid in v4) ----
baselines: [persistence, ar1]

# --- criteria (IDENTICAL to v1/v2/v3 — frozen since before v1's run; each
# --- track states them in its own declared steps via the tracks block) -----
criteria:
  min_median_lead_business_days: 10
  max_false_alarms_per_quiet_year: 4
  beat_baselines: AUC and AP strictly above BOTH persistence and AR(1) on the
    scorer's own grid
  ap_above_base_rate: true (on the scorer's own grid)
  significance: permutation p (1000 shuffles, seed 20260917) surviving
    Holm-Bonferroni at alpha 0.05

# --- multiplicity (declared) -----------------------------------------------
verdict_rules:
  holm_pool: ALL scorer-indicator pairs the protocol runs (four scorers
    quadruple the hypotheses; pooling fewer would understate multiplicity)
  indicator_pass: ANY declared scorer passes all four criteria with a
    Holm-surviving AP
  family_claim: ">= half of tested indicators pass AND >= 3 testable
    (identical to v1/v2/v3)"

# --- transport --------------------------------------------------------------
transport:
  fred: FRED_API_KEY from the environment; never written to any file;
    recorded endpoints carry api_key=<redacted>
  bis: stats.bis.org SDMX REST, keyless CSV; quarter periods map to
    quarter-END calendar dates (declared convention); payload must be one
    homogeneous series or the fetch refuses (format drift is a refusal, not
    a guess)
  licence_screen: >-
    BEFORE download for every series. FRED: the series' own notes vs
    LICENCE_PROHIBITION_RE. BIS: the live terms page (data.bis.org/help/legal)
    vs the same patterns, with the permission sentence required to be
    observable (drift => licence_unconfirmed => refuse; the BoE-404 precedent)
    and the attribution recorded: "Source: BIS Data Portal - Bank for
    International Settlements"

# --- run rules (identical, plus the v4 outcome handling) --------------------
run_rules:
  single_run: one evaluation run per tagged protocol; re-runs only for
    documented pre-metric infrastructure defects, logged with diffs
  negative_results: published unchanged
  sequence: tag -> fetch -> evaluate (the v3 sequence; the manifest with
    per-series SHA-256, licence lines and redacted endpoints commits with
    the report)
  outcome_handling: declared before the run. PASS (family claim warranted)
    -> the README claim gate moves, carrying these numbers. FAIL -> the line
    REMAINS PARKED with a four-run documented record; there is no planned
    v5 — any further iteration needs a new owner decision and new recorded
    axes, exactly as v4 needed. Either outcome is publishable; neither gets
    argued with after the fact.
  execution: in-process (declared deviation, as v1/v2/v3)
